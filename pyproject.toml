[project]
name = "audio-transcription-service"
version = "0.1.0"
description = "Production-oriented local speech-to-text service."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Alexandru Noroc", email = "kradores10@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.3.0",
    "pyaudiowpatch>=0.2.12.8",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "soxr>=1.1.0",
    "uvicorn>=0.52.1",
    "silero-vad>=6.2.1,<7",
    "faster-whisper>=1.2.1",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[project.scripts]
audio-transcription-service = "app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-timeout>=2.3.1",
]

[tool.ruff]

line-length = 100
target-version = "py314"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
mypy_path = ["typings"]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 30
markers = [
    "slow_integration: integration tests that execute real ML models and may take significantly longer than normal tests",
]

[tool.coverage.run]
branch = true
