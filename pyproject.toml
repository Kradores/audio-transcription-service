[project]
[project]
name = "audio-transcription-service"
version = "0.1.0"
description = "Production-oriented local speech-to-text service."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Alexandru Noroc", email = "kradores10@gmail.com" }
]
dependencies = []

[project.scripts]
audio-transcription-service = "audio_transcription_service:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black",
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]

line-length = 100
target-version = ["py314"]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.black]

line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
