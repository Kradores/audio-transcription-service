application:
  name: audio-transcription-service
  environment: development

api:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO

audio:
  capture:
    queue_capacity: 100

  processing:
    sample_rate: 16000
    channels: 1

  segmentation:
    pre_roll_ms: 80
    post_roll_ms: 80
    target_duration_seconds: 3
    max_duration_seconds: 10

transcription:
  queue_capacity: 10

vad:
  enabled: true
  speech_threshold: 0.5
  min_silence_duration_ms: 300

whisper:
  model: small
  device: cpu
  compute_type: int8

database:
  path: transcripts.db