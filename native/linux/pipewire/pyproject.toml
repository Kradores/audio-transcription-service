[project]
name = "ats-pipewire-native"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cffi>=2.0",
]

[build-system]
requires = [
    "setuptools>=80",
    "cffi>=2.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "build_pipewire.py" },
    { file = "src/**/*.c" },
    { file = "src/**/*.h" },
]