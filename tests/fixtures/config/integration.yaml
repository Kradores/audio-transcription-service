application:
  name: audio-transcription-service
  environment: development

api:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO

  file:
    enabled: true
    path: logs/audio-transcription-service.log
    max_bytes: 10485760
    backup_count: 5

audio:
  capture:
    queue_capacity: 100

  processing:
    sample_rate: 16000
    channels: 1

  segmentation:
    pre_roll_ms: 80
    post_roll_ms: 80
    target_duration_seconds: 3
    max_duration_seconds: 10

transcription:
  queue_capacity: 10
  worker_count: 1
  microphone_gain_db: 0.0

  language:
    mode: auto

  aggregation:
    enabled: true
    target_duration_seconds: 5.0
    max_duration_seconds: 10.0
    max_gap_seconds: 1.5
    max_wait_seconds: 2.0

vad:
  enabled: true
  speech_threshold: 0.5
  min_silence_duration_ms: 300

whisper:
  model: small
  runtime: default
  device: cpu
  compute_type: int8

database:
  path: transcripts.db